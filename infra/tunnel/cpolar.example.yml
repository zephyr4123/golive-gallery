# cpolar 配置模板 —— 绑自有域名做长期示范
#
# 本文件对应本机的 ~/.cpolar/cpolar.yml。
# 官方文档说服务化后会改读 /usr/local/etc/cpolar/cpolar.yml —— 实测不是:
# 无论前台还是 launchd 下的 service,日志第一行都写 "Reading configuration
# file ~/.cpolar/cpolar.yml",`cpolar http --help` 里 -config 的默认值也是它。
#
# 两个前提(2026-08-23 实测于 cpolar 3.3.18 + Pro 账号):
#   1. 绑自有域名需 专业版(Pro)及以上,基础版只能给固定二级子域名
#   2. HTTPS 证书必须自备 crt/key —— cpolar 不签发也不续期。
#      「绑上域名就有 https」只适用于它自家的 *.cpolar.cn / *.cpolar.top。
#      这一条不是可选项:不给证书时边缘 443 端口 TCP 连得上、但 TLS 握手
#      直接断(openssl 报 no peer certificate available),等于 HTTPS 完全不通。
#
# 地区(region)常被讲错,实测口径:
#   - 真正决定线路的是后台「预留 → 保留自定义域名」时选的地区,它决定系统
#     发给你的 CNAME 目标(例:选 Hong Kong VIP 拿到 xxx.cname.vip.hk.cpolar.io,
#     解析到香港阿里云 AS45102)。未备案域名选境外地区即可,已实测跑通。
#   - 下面这个 region 只决定客户端连哪台 cpolar 服务器,与公网路径无关。
#     实测:保留地区为 hk 时,不写 region、或写成 us,隧道都照常建立且全链路 200。
#     所以它不是「写错就起不来」的字段,留空也行。
#
# authtoken 用 `cpolar authtoken <TOKEN>` 写入本机,不进仓库。
# ⚠️ cpolar service 会改写 ~/.cpolar/cpolar.yml(自动补 id / bind_tls /
#    start_type,并在文件末尾追加 email:)。手工追加隧道很容易写到 tunnels:
#    块外面 —— 改完务必跑一次 `cpolar list`,YAML 写坏它会直接报错误行号。
# YAML 缩进敏感且不能有 TAB —— 官方专门警告过这一条。

tunnels:
  # 名字与你自己已有的隧道(ssh / website 之类)共用一份配置文件,别撞名
  <SITE>:
    proto: http
    addr: "4173"
    hostname: <SUBDOMAIN>.<BASE_DOMAIN> # 先在 cpolar 后台预留并加 CNAME,再到 infra/dns/records.md 登记
    region: hk # 可选,见文件头「地区」一节:它只影响客户端连哪台服务器

    # 证书路径。私钥绝不进仓库 —— 放本机 ~/.cpolar/certs/(目录 700、key 600)
    crt: <PATH_TO_TLS_CRT>
    key: <PATH_TO_TLS_KEY>

# 起单条:cpolar start <SITE>      起全部:cpolar start-all
