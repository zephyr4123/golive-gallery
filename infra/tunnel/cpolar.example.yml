# cpolar 配置模板 —— 付费订阅绑定自定义域名(海外节点免备案)
# authtoken 用 `cpolar authtoken <TOKEN>` 写入本机 ~/.cpolar/,不进仓库

tunnels:
  golive-<SITE>:
    proto: http
    addr: "4173"
    region: us          # 大陆节点要求域名已备案,.gallery 走海外节点
    hostname: <SUBDOMAIN>.<BASE_DOMAIN> # 填你站点的 subdomain(cpolar 后台配 CNAME),并先在 infra/dns/records.md 登记
